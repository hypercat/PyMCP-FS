name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} --with pytest --with pytest-asyncio pytest -q

  # Single check for branch protection to require. Succeeds only when every
  # matrix job succeeded, so new matrix entries need no protection changes.
  tests-passed:
    name: tests-passed
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Verify every test job succeeded
        run: |
          echo "Matrix result: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success"
