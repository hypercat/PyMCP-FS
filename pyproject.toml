[project]
name = "PyMCP-FS"
version = "0.1.0"
description = "This is a robust Python-based MCP Filesystem Server. It enables AI models and applications to securely interact with the host system's file directories through a defined set of tools, allowing for operations like reading, writing, moving, and listing files and directories."
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.6.1",
]

[dependency-groups]
# mcp[cli] is a development convenience (the `mcp` command); the server itself
# imports only fastmcp, which depends on mcp in its own right.
dev = [
    "mcp[cli]>=1.9.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
